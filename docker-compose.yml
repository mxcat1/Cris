services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Nd8GaWPGY12qe8J3JyDHisaK
      MYSQL_DATABASE: erp_computacion
      MYSQL_USER: erpcomp
      MYSQL_PASSWORD: L1tV9UQvX2oKsG0x4WeEUOCN
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - erpcomp_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -pNd8GaWPGY12qe8J3JyDHisaK"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-test:
    image: mysql:8.0
    container_name: erp_computacion_mysql_test
    environment:
      MYSQL_ROOT_PASSWORD: test_root_password
      MYSQL_DATABASE: erp_computacion_test
      MYSQL_USER: erpcomp_test
      MYSQL_PASSWORD: test_password
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - erpcomp_mysql_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3100:3000"
    env_file:
      - ./Backend/.env
    volumes:
      - ./Backend:/app:delegated
      - erpcomp_backend_node_modules:/app/node_modules
      - erpcomp_backend_uploads:/app/src/uploads
    command: npm run start

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3100/api
      VITE_FACTURADOR_API_URL: http://localhost:8001/api
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./Frontend:/app:delegated
      - erpcomp_frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

  # ecommerce-integration hot-patch: tienda pública Next.js que consume las
  # rutas /api/ecommerce/* del Backend. Requiere FEATURE_ECOMMERCE=true en
  # el .env del Backend para que esas rutas estén montadas.
  ecommerce:
    build:
      context: ./Ecommerce
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Puerto 3030 en host → 3000 dentro del container (para evitar colisión
      # con otros servicios Next.js que pudieran estar en 3000).
      - "3030:3000"
    environment:
      # URL que usa el BROWSER del cliente para llamar al Backend.
      # El host mapea localhost:3100 -> container backend:3000.
      NEXT_PUBLIC_API_URL: http://localhost:3100
      NODE_ENV: production

volumes:
  erpcomp_mysql_data:
  erpcomp_backend_node_modules:
  erpcomp_backend_uploads:
  erpcomp_frontend_node_modules:
  erpcomp_mysql_test_data:
